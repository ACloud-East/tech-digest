name: Fetch Tech News Daily

# 关键修复：默认 GITHUB_TOKEN 只有读权限，缺少 contents: write 会导致 git push 静默失败、
# news.json 永远不更新（即用户看到的“14 小时前”陈旧数据）。必须显式声明写入权限。
permissions:
  contents: write
  pages: write

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须用 Node 22+：wrangler@latest 要求 Node >=22，否则部署步骤会直接报错退出
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试抓取 ==="
            if npm run fetch; then
              echo "抓取成功"
              break
            fi
            echo "第 $i 次失败，15 秒后重试..."
            sleep 15
          done
        timeout-minutes: 45

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news-meta.json data/decode-cache.json
          git diff --cached --quiet || git commit -m "chore: update news data [$(date -u +%Y-%m-%d)]"
          git push

      # 关键：fetch-news 用 GITHUB_TOKEN 提交的 push 不会触发其它 push 工作流
      # （deploy-cloudflare.yml 仅监听 push），所以必须在本工作流内直接重新部署
      # Cloudflare Pages，否则线上（tech-digest-74r.pages.dev）会一直停留在旧部署、
      # 数据陈旧（曾出现“两天前”的问题）。
      # 另外仓库根 _headers 已对 /data/* 设置 Cache-Control: no-cache，
      # 配合每次重新部署，可保证用户拿到的是最新抓取的数据。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest
          wrangler pages deploy . --project-name=tech-digest --branch=main --commit-dirty=true

      - name: Trigger Pages rebuild (instant CDN refresh)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
