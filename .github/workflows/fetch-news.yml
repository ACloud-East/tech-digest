name: Fetch Tech News Daily

on:
  schedule:
    # 每 2 小时抓取一次（UTC 0/2/4...22 点 = 北京时间 8/10/12...6 点），最大限度保证看板新鲜
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: npm run fetch
        timeout-minutes: 30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: update news data [$(date -u +%Y-%m-%d)]"
          git push
