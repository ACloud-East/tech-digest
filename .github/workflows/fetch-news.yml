name: Fetch Tech News Daily

# 关键修复：默认 GITHUB_TOKEN 只有读权限，缺少 contents: write 会导致 git push 静默失败、
# news.json 永远不更新（即用户看到的“14 小时前”陈旧数据）。必须显式声明写入权限。
permissions:
  contents: write
  pages: write

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试抓取 ==="
            if npm run fetch; then
              echo "抓取成功"
              break
            fi
            echo "第 $i 次失败，15 秒后重试..."
            sleep 15
          done
        timeout-minutes: 45

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/decode-cache.json
          git diff --cached --quiet || git commit -m "chore: update news data [$(date -u +%Y-%m-%d)]"
          git push

      - name: Trigger Pages rebuild (instant CDN refresh)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
