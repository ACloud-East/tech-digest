name: Fetch Tech News Daily

# 关键修复：默认 GITHUB_TOKEN 只有读权限，缺少 contents: write 会导致 git push 静默失败、
# news.json 永远不更新（即用户看到的“14 小时前”陈旧数据）。必须显式声明写入权限。
permissions:
  contents: write

on:
  schedule:
    # 每小时抓取一次（UTC 整点 = 北京时间早 8 点至次日早 7 点），最大限度保证看板新鲜
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: npm run fetch
        timeout-minutes: 30

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/decode-cache.json
          git diff --cached --quiet || git commit -m "chore: update news data [$(date -u +%Y-%m-%d)]"
          git push
